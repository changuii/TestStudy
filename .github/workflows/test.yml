name: Run Test

on:
  pull_request:
    branches:
      - main
      - backend

jobs:
  build: # job 이름은 'test'나 'ci' 등 더 명확하게 변경하는 것을 권장합니다.
    runs-on: ubuntu-latest # 우분투 최신 버전
    permissions:
      contents: read

    steps:
    - name: Repository Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v8.14.2

    - name: Run Gradle Test
      run: ./gradlew clean test
      working-directory: src
